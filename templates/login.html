
{% extends "base.html" %}

{% block title %}CRM Login{% endblock %}

{% block styles %}
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            max-width: 92%;
            background: white;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            color: #222;
            font-size: 28px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93aeea;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="login-box">
        <h1>CRM System</h1>

        <p class="subtitle">Sign in to your account</p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">Login</button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
    </div>

{% endblock %}

{% block scripts %}
    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.style.color = "#555";
            message.textContent = "Checking login details...";
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    message.style.color = "green";
                    message.textContent = "Login successful! Opening dashboard...";

                    window.location.assign("/dashboard");
                } else {
                    message.style.color = "red";
                    message.textContent = data.message || "Login failed. Please try again.";

                    loginButton.disabled = false;
                    loginButton.textContent = "Login";
                }

            } catch (error) {
                console.error("Login error:", error);

                message.style.color = "red";
                message.textContent = "Unable to connect. Please check that the CRM server is running.";

                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>
{% endblock %}
